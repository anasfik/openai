name: dart_openai
description: Unofficial Dart & Flutter SDK for the OpenAI API. Typed clients for Responses, Chat, Realtime, Videos, Batch, Fine-tuning, Vector Stores and more.
version: 8.0.0
homepage: https://github.com/anasfik/openai
repository: https://github.com/anasfik/openai
documentation: https://github.com/anasfik/openai/blob/main/README.md
issue_tracker: https://github.com/anasfik/openai/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.6.0
  http_parser: ^4.1.2
  meta: ^1.11.0
  collection: ^1.19.0
  fetch_client: ^1.2.1

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.3
